<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--acc:#f2a516;--acc2:#ffcf5a;--bg:#0b0d10;--panel:rgba(14,17,21,.92);--line:rgba(255,255,255,.12);--txt:#e9e6df;--dim:#9a978f;--red:#e0392b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:"Noto Sans JP",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
.screen{position:absolute;inset:0;display:none;z-index:10}
.screen.on{display:flex}
.f-oswald{font-family:Oswald,"Noto Sans JP",sans-serif;letter-spacing:.04em}
#menu{background:radial-gradient(ellipse at 70% 30%,rgba(242,165,22,.10),transparent 60%),linear-gradient(115deg,rgba(7,8,10,.97) 0%,rgba(18,21,25,.80) 55%,rgba(10,11,13,.55) 100%);align-items:stretch}
#menu .left{width:460px;flex:none;padding:56px 48px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.1))}
.logo{font-family:Oswald,sans-serif;font-weight:700;font-size:64px;line-height:.9;letter-spacing:.06em;color:#fff}
.logo span{color:var(--acc)}
.sub{color:var(--dim);font-size:13px;margin:8px 0 34px;letter-spacing:.1em}
.mbtn{font-family:Oswald,"Noto Sans JP",sans-serif;font-size:24px;font-weight:600;letter-spacing:.08em;text-align:left;background:none;border:none;color:#cfcac0;padding:10px 14px;cursor:pointer;border-left:3px solid transparent;transition:.12s}
.mbtn small{display:block;font-family:"Noto Sans JP";font-size:11px;font-weight:400;color:var(--dim);letter-spacing:.05em}
.mbtn:hover,.mbtn.sel{color:#fff;border-left-color:var(--acc);background:linear-gradient(90deg,rgba(242,165,22,.18),transparent)}
#menu .right{flex:1;padding:56px 48px;overflow:auto}
.panel h2{font-family:Oswald,"Noto Sans JP";font-size:30px;letter-spacing:.08em;margin-bottom:6px}
.panel h2 b{color:var(--acc)}
.panel .desc{color:var(--dim);font-size:13px;margin-bottom:22px;line-height:1.7}
.row{display:flex;align-items:center;gap:14px;margin:10px 0;flex-wrap:wrap}
.row label{width:190px;color:#cfcac0;font-size:14px}
.row input[type=range]{width:240px;accent-color:var(--acc)}
.row .val{width:60px;font-family:Oswald;color:var(--acc2)}
.row input.num{width:78px;background:#0d0f12;border:1px solid var(--line);color:var(--acc2);font-family:Oswald,"Noto Sans JP";font-size:14px;padding:4px 6px}
.row input.num:focus{outline:none;border-color:var(--acc)}
select,.chip{background:#1a1e24;color:var(--txt);border:1px solid var(--line);padding:7px 10px;font-size:14px;font-family:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{cursor:pointer;transition:.1s;min-width:120px;text-align:left}
.chip b{display:block;font-family:Oswald,"Noto Sans JP";font-size:16px;letter-spacing:.04em}
.chip i{font-style:normal;color:var(--dim);font-size:11px}
.chip.on{border-color:var(--acc);background:rgba(242,165,22,.14)}
.chip.dis{opacity:.35;cursor:not-allowed}
.go{font-family:Oswald,"Noto Sans JP";font-size:22px;font-weight:700;letter-spacing:.1em;background:var(--acc);color:#111;border:none;padding:12px 34px;cursor:pointer;margin-top:18px}
.go:hover{background:var(--acc2)}
.ghost{font-family:Oswald,"Noto Sans JP";font-size:16px;background:none;border:1px solid var(--line);color:var(--txt);padding:10px 22px;cursor:pointer;margin-top:18px;margin-left:8px}
.ghost:hover{border-color:var(--acc)}
.sec{margin:22px 0 8px;font-family:Oswald,"Noto Sans JP";color:var(--acc);letter-spacing:.12em;font-size:13px}
.pts{display:flex;gap:5px;margin:6px 0 4px}
.pts i{width:22px;height:8px;background:#2a2f37}
.pts i.u{background:var(--acc)}
.statbar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);margin:3px 0}
.statbar div{width:180px;height:6px;background:#2a2f37}
.statbar div i{display:block;height:100%;background:#d8d2c4}
table.keys{border-collapse:collapse;font-size:13px}
table.keys td{padding:5px 14px 5px 0;border-bottom:1px solid var(--line)}
table.keys td:first-child{color:var(--acc2);font-family:Oswald,"Noto Sans JP";white-space:nowrap}
.tips{font-size:13px;line-height:1.9;color:#cfcac0}
.tips b{color:var(--acc2)}
#pause,#endscr,#loading{background:rgba(0,0,0,.72);align-items:center;justify-content:center}
.box{background:var(--panel);border:1px solid var(--line);padding:30px 40px;min-width:380px;text-align:center;max-height:92%;overflow-y:auto}
.binds{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:2px 26px;margin:6px 0 4px}
.bgrp{grid-column:1/-1;color:var(--acc);font-family:Oswald,"Noto Sans JP";font-size:12px;letter-spacing:.12em;margin:10px 0 2px}
.brow{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--line)}
.brow span{flex:1;font-size:13px;color:#cfcac0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkey{width:118px;flex:none;background:#0d0f12;border:1px solid var(--line);color:var(--acc2);font-family:Oswald,"Noto Sans JP";font-size:12px;padding:5px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkey:hover{border-color:var(--acc)}
.bkey.wait{background:var(--acc);color:#111;animation:bblink .6s infinite alternate}
.bkey.empty{color:#555}
@keyframes bblink{to{opacity:.55}}
.bnote{font-size:12px;color:var(--dim);min-height:18px;margin:4px 0}
.box h2{font-family:Oswald,"Noto Sans JP";letter-spacing:.1em;font-size:34px;margin-bottom:10px}
.box .go,.box .ghost{display:block;width:100%;margin:10px 0 0}
#board{position:absolute;left:50%;top:12%;transform:translateX(-50%);display:none;z-index:9;background:var(--panel);border:1px solid var(--line);padding:18px 24px;min-width:520px}
#board table,#endtable{width:100%;border-collapse:collapse;font-size:14px}
#board th,#endtable th{text-align:left;color:var(--dim);font-weight:400;font-size:12px;padding:4px 8px;border-bottom:1px solid var(--line)}
#board td,#endtable td{text-align:left;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
tr.me td{color:var(--acc2);background:rgba(242,165,22,.08)}
#clicktip{position:absolute;left:50%;top:58%;transform:translateX(-50%);z-index:8;font-family:Oswald,"Noto Sans JP";font-size:18px;letter-spacing:.1em;background:rgba(0,0,0,.6);padding:10px 20px;display:none;pointer-events:none}
/* compact create-a-class */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px;margin:4px 0 10px}
.tile{background:#181c22;border:1px solid var(--line);color:var(--txt);padding:6px 8px;text-align:left;cursor:pointer;font-family:inherit;min-height:38px;transition:.08s}
.tile b{display:block;font-family:Oswald,"Noto Sans JP";font-size:13px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile i{display:block;font-style:normal;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:hover{border-color:#6b6556}.tile.on{border-color:var(--acc);background:rgba(242,165,22,.15)}.tile.dis{opacity:.32;cursor:not-allowed}
.cacgrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.infobox{position:sticky;top:0;background:rgba(14,17,21,.9);border:1px solid var(--line);padding:14px;font-size:12px;line-height:1.7;color:#cfcac0;min-height:180px}
.infobox h3{font-family:Oswald,"Noto Sans JP";font-size:17px;color:#fff;margin-bottom:4px}
.lbl{font-family:Oswald,"Noto Sans JP";color:var(--acc);letter-spacing:.1em;font-size:11px;margin-top:6px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cols3>div{min-width:0}.cols3 .tiles{grid-template-columns:1fr}.cols3 .tile i{white-space:normal;line-height:1.35}
.tile{min-width:0;overflow:hidden}
.tabs{display:flex;gap:4px;margin:10px 0 8px;flex-wrap:wrap}
.tabs button{font-family:Oswald,"Noto Sans JP";font-size:14px;background:none;border:1px solid var(--line);color:var(--txt);padding:6px 14px;cursor:pointer}
.tabs button.on{border-color:var(--acc);color:var(--acc);background:rgba(242,165,22,.1)}
.sw{display:block;height:16px;margin-bottom:4px}
/* ===== Create-a-Class (full screen) ===== */
#cac{background:linear-gradient(120deg,#07080a,#111419);flex-direction:column;padding:26px 34px 20px;gap:14px;z-index:12;overflow:hidden}
#cac .hd{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
#cac .hd h2{font-family:Oswald,"Noto Sans JP";font-size:30px;letter-spacing:.08em;white-space:nowrap}
#cac .hd h2 b{color:var(--acc)}
.ctabs{display:flex;gap:4px}
.ctabs button{font-family:Oswald,"Noto Sans JP";font-size:14px;background:#15181d;border:1px solid var(--line);color:#bbb;padding:7px 14px;cursor:pointer;min-width:96px;text-align:left}
.ctabs button.on{border-color:var(--acc);color:#fff;background:rgba(242,165,22,.14)}
.pick10{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:Oswald;font-size:20px}
.pick10 .pips{display:flex;gap:4px}.pick10 .pips i{width:16px;height:16px;border:1px solid #555;transform:rotate(45deg) scale(.75)}
.pick10 .pips i.u{background:var(--acc);border-color:var(--acc)}
#cac .bd{flex:1;min-height:0;display:grid;grid-template-columns:400px minmax(0,1fr);gap:26px}
.slots{overflow-y:auto;min-height:0;padding-right:4px}
.slot{display:flex;align-items:stretch;background:#12151a;border:1px solid var(--line);margin-bottom:5px;cursor:pointer;transition:.08s}
.slot:hover{border-color:#6b6556}.slot.on{border-color:var(--acc);background:rgba(242,165,22,.09)}
.slot .k{width:96px;flex:none;font-family:Oswald,"Noto Sans JP";font-size:11px;letter-spacing:.08em;color:var(--acc);padding:9px 10px;border-right:1px solid var(--line);display:flex;align-items:center}
.slot .v{padding:7px 12px;min-width:0;flex:1;align-self:center}
.slot .v .sub span .sw,.slot .v .sub i.sw{display:inline-block!important;margin:0}
.slot .v b{display:block;font-family:Oswald,"Noto Sans JP";font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .v i{display:block;font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .v .sub{display:flex;gap:4px;margin:5px 0 0;flex-wrap:wrap;letter-spacing:0;font-size:inherit;color:inherit}
.slot .v .sub span{font-size:11px;padding:2px 7px;border:1px solid var(--line);background:#0d0f13;color:#ddd;cursor:pointer}
.slot .v .sub span.empty{color:#666;border-style:dashed}
.slot .v .sub span.on{border-color:var(--acc)}
.slot.empty .v b{color:#666}
.picker{min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px}
.picker .ph{display:flex;align-items:baseline;gap:14px}
.picker .ph h3{font-family:Oswald,"Noto Sans JP";font-size:22px;letter-spacing:.05em}
.picker .ph span{color:var(--dim);font-size:12px}
.pcats{display:flex;gap:4px;flex-wrap:wrap}
.pcats button{font-family:Oswald,"Noto Sans JP";font-size:13px;background:#15181d;border:1px solid var(--line);color:#bbb;padding:5px 12px;cursor:pointer}
.pcats button.on{border-color:var(--acc);color:#fff}
.pbody{min-height:0;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:18px}
.plist{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.pitem{display:flex;align-items:center;gap:10px;background:#15181d;border:1px solid var(--line);padding:8px 12px;cursor:pointer;text-align:left;color:var(--txt);font-family:inherit}
.pitem:hover{border-color:#6b6556}.pitem.on{border-color:var(--acc);background:rgba(242,165,22,.13)}.pitem.dis{opacity:.38}
.pitem b{font-family:Oswald,"Noto Sans JP";font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem i{font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap}
.pitem .sw{width:34px;height:20px;margin:0;flex:none}
.pdetail{overflow-y:auto;min-height:0;background:#101317;border:1px solid var(--line);padding:18px 22px;font-size:13px;line-height:1.8;color:#cfcac0}
.pdetail h4{font-family:Oswald,"Noto Sans JP";font-size:26px;color:#fff;letter-spacing:.04em;margin-bottom:2px}
.pdetail .tag{display:inline-block;font-size:11px;color:var(--acc);border:1px solid rgba(242,165,22,.4);padding:1px 8px;margin-bottom:10px}
.pdetail .warn{color:#ff7a6a;margin-top:8px}
.pdetail .statbar{gap:8px}.pdetail .statbar span{white-space:nowrap;width:64px!important;flex:none}.pdetail .statbar div{flex:1;max-width:240px;width:auto}
.pdetail .kv{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;margin-top:10px;font-size:12px}
.pdetail .kv span:nth-child(odd){color:var(--dim)}
.cacft{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cacft button{white-space:nowrap}
.cacft .hint{color:var(--dim);font-size:12px;margin-left:8px}
.cacft .go,.cacft .ghost{margin:0}
#err{position:fixed;left:0;right:0;bottom:0;background:#400;color:#fff;font:12px monospace;padding:6px;display:none;z-index:99;white-space:pre-wrap}
</style>
</head>
<body>
<div id="stage">
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="clicktip">クリックで操作開始</div>
<div id="board"></div>

<div id="menu" class="screen on">
  <div class="left">
    <div class="logo" style="margin-bottom:28px">FPS</div>
    <button class="mbtn sel" data-p="play">プレイ<small>Botとフリーフォーオール / 射撃場</small></button>
    <button class="mbtn" data-p="online">オンライン<small>部屋を作って友達と対戦</small></button>
    <button class="mbtn" data-p="cac">クラス作成<small>ピック10で装備を組む</small></button>
    <button class="mbtn" data-p="opt">設定<small>感度・視野角・キー割り当て</small></button>
    <button class="mbtn" data-p="help">操作方法<small>キーボード / ゲームパッド</small></button>
  </div>
  <div class="right">
    <div class="panel" id="p-play"></div>
    <div class="panel" id="p-online" style="display:none"></div>
    <div class="panel" id="p-cac" style="display:none"></div>
    <div class="panel" id="p-opt" style="display:none"></div>
    <div class="panel" id="p-help" style="display:none"></div>
  </div>
</div>

<div id="pause" class="screen">
  <div class="box">
    <h2>一時停止</h2>
    <button class="go" id="bResume">再開</button>
    <button class="ghost" id="bPauseOpt">設定</button>
    <button class="ghost" id="bQuit">メニューに戻る</button>
  </div>
</div>
<div id="endscr" class="screen">
  <div class="box" style="min-width:560px">
    <h2 id="endTitle">試合終了</h2>
    <div id="endSub" style="color:var(--dim);margin-bottom:14px"></div>
    <table id="endtable"></table>
    <button class="go" id="bAgain">もう一度</button>
    <button class="ghost" id="bEndMenu">メニューに戻る</button>
  </div>
</div>
<div id="cac" class="screen"></div>
</div>
<div id="err"></div>
